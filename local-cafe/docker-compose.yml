services:
  # ──────────────────────────────────────────────
  # 1. Local Database (PostgreSQL 16 Alpine)
  # Reachable ONLY within internal Docker network (no host port exposure)
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: local_cafe_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - cafe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────
  # 2. Local Express Backend API & Socket.IO
  # Private behind Nginx; no published host ports
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: local_cafe_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      UPLOAD_DIR: /app/uploads
    volumes:
      - cafe_media_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────
  # 3. Local Nginx Reverse Proxy & React Frontend
  # Public web entry point
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: local_cafe_frontend
    restart: always
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - cafe_media_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────
  # 4. Supported Public HTTPS Method: Cloudflare Tunnel
  # Activated with: docker compose --profile tunnel up -d
  # Routes public HTTPS traffic directly to Nginx (frontend:80)
  # Keeps PostgreSQL and Express API inaccessible to the internet
  # ──────────────────────────────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: local_cafe_tunnel
    restart: always
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required when running with --profile tunnel}
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  cafe_pgdata:
    name: cafe_pgdata
  cafe_media_data:
    name: cafe_media_data
