<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Kusum Kunja Café</title>
    <meta name="description" content="Artisan food and specialty coffee. Contactless digital table ordering." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Café Menu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/kusum-kunja-cafe-logo.png" />
    <link rel="apple-touch-icon" href="/kusum-kunja-cafe-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const showStartupError = (message) => {
          const root = document.getElementById("root");
          if (!root || root.childElementCount) return;
          root.dataset.startupError = message || "The menu script failed to start.";
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#F8F5EF;color:#29231F;font:16px sans-serif"><section style="max-width:420px;padding:24px;border:1px solid #E5DDD1;border-radius:18px;background:#FFFDF9;text-align:center"><h1 style="font: bold 26px Georgia,serif">The menu couldn’t load</h1><p>Please refresh the page. If the problem continues, ask the café staff for help.</p></section></main>';
        };
        window.addEventListener("error", (event) => showStartupError(event.message), true);
        window.addEventListener("unhandledrejection", (event) => showStartupError(event.reason?.message), true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
